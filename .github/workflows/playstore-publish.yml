name: Publish to Google Play

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish-playstore:
    name: Build & upload APK to Play Store
    # Only stable tags (vX.Y.Z) go to the Play Store; pre-release tags
    # (v1.7.0-beta.1, ...) are skipped so test builds never reach the listing.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "microsoft"
          cache: 'gradle'

      - name: Update build product flavor
        run: |
          echo "" >> ./gradle.properties
          echo "isFullBuild=true" >> ./gradle.properties

      - name: Decode Play Store service account
        env:
          PLAY_STORE_SERVICE_ACCOUNT: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$PLAY_STORE_SERVICE_ACCOUNT" ]; then
            echo "::warning::PLAY_STORE_SERVICE_ACCOUNT secret is not set — skipping Play Store upload."
            exit 0
          fi
          echo "$PLAY_STORE_SERVICE_ACCOUNT" | base64 -d > fastlane/service-account.json

      - name: Build release APK
        run: ./gradlew androidApp:assembleRelease

      - name: Verify single APK
        run: |
          count=$(ls androidApp/build/outputs/apk/release/*.apk 2>/dev/null | wc -l)
          echo "Found $count APK(s) in release output."
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly 1 universal APK, found $count."
            exit 1
          fi

      - name: Upload to Play Store (internal track)
        env:
          PLAY_STORE_SERVICE_ACCOUNT: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT }}
        run: |
          if [ ! -f fastlane/service-account.json ]; then
            echo "Skipping Play Store upload (no service account)."
            exit 0
          fi
          bundle install --quiet
          bundle exec fastlane android upload_playstore
