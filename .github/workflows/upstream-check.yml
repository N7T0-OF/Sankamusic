# Upstream compatibility - surveillance de la base SimpMusic
#
# Execute scripts/check-upstream.sh contre la derniere release de
# maxrave-dev/SimpMusic (hebdomadaire + manuel) :
#   - compatible   -> rapport telechargeable (artefact upstream-compat)
#   - incompatible -> rapport + issue GitHub automatique (jamais de release
#                     Sankamusic basee sur une version upstream non verifiee)
#
# Ne compile pas : la verification de CONTRAT par fonctionnalite est faite par
# le compilateur (adapter -> tests) dans ci.yml. Ici on detecte tot les
# changements de version qui sortent une fonctionnalite de sa plage declaree.

name: Upstream compatibility

on:
  schedule:
    # Tous les lundis a 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check latest SimpMusic release compatibility
        id: check
        run: bash scripts/check-upstream.sh build/upstream

      - name: Upload compatibility report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-compat
          path: build/upstream/upstream-compat.txt

      - name: Open issue on incompatibility (once)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Ne pas dupliquer l'issue si une est deja ouverte avec le meme titre.
          if gh issue list --state open --search "Upstream SimpMusic : fonctionnalite hors plage" --json number --jq 'length' | grep -q '^[1-9]'; then
            echo "Issue deja ouverte - rien a creer."
          else
            gh issue create \
              --title "Upstream SimpMusic : fonctionnalite hors plage" \
              --body "La derniere release de **maxrave-dev/SimpMusic** sort au moins une fonctionnalite SpaceKai de sa plage de compatibilite declaree.

Voir le rapport complet dans l'artefact **upstream-compat** de ce run.

### A faire
1. Telecharger le rapport (run -> artefacts).
2. Mettre a jour l'**adapter** (core/.../update/SimpMusicAdapter.kt) et/ou la plage dans le manifest (core/.../api/FeatureManifest.kt).
3. Revalider : tests core + CI vert.
4. Reexecuter ce workflow (workflow_dispatch) pour confirmer le passage au vert."
          fi
