# Release — Vérifications réelles + publication (draft)
#
# Conforme à RELEASE_GUIDE.md § 5 : le CI échoue plutôt que publier un artefact
# incertain. Les vérifications suivantes sont exécutées sur l'artefact RÉEL :
#   - exactement 1 APK de publication (jamais plusieurs, jamais debug/unsigned)
#   - signature valide (apksigner verify)
#   - version de l'APK == version du tag git (source unique de vérité)
#   - SHA256SUMS.txt généré puis re-vérifié (sha256sum -c)
#
# La release est créée en DRAFT : elle ne devient publique qu'après la
# vérification post-publication manuelle (RELEASE_GUIDE.md étape 7).
#
# ⚠️ Secrets requis (jamais commités, voir docs/BUILD_SYSTEM.md et docs/SECURITY.md) :
#   ANDROID_KEYSTORE_BASE64      keystore encodé en base64
#   ANDROID_KEYSTORE_PASSWORD    mot de passe du keystore
#   ANDROID_KEY_ALIAS            alias de la clé
#   ANDROID_KEY_PASSWORD         mot de passe de la clé

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_TASK: assembleRelease
  APK_OUTPUT_DIR: app/build/outputs/apk/release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK
        run: |
          # Même SDK qu'au CI (ubuntu-latest n'en installe pas par défaut).
          SDK="${ANDROID_HOME:-$HOME/android-sdk}"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o /tmp/cmdline.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q /tmp/cmdline.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" >/dev/null
          echo "sdk.dir=$SDK" > local.properties
          echo "Android SDK installé dans $SDK (platforms;android-35, build-tools;35.0.0)"

      - name: Build release APK
        run: ./gradlew $GRADLE_TASK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Enforce exactly one release APK
        run: |
          mapfile -t apks < <(ls "$APK_OUTPUT_DIR"/*.apk 2>/dev/null || true)
          count=${#apks[@]}
          echo "APK(s) détecté(s) : $count"
          for f in "${apks[@]}"; do echo "  - $f"; done
          if [ "$count" -ne 1 ]; then
            echo "::error::Release invalide : $count APK(s). Il faut EXACTEMENT 1 APK universel signé."
            exit 1
          fi
          case "${apks[0]}" in
            *-debug*|*-unsigned*|*unaligned*)
              echo "::error::Artefact non valide pour publication : ${apks[0]}"
              exit 1
              ;;
          esac
          echo "APK_RELEASE=${apks[0]}" >> "$GITHUB_ENV"

      - name: Verify signature (apksigner)
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$apksigner" verify --print-certs "$APK_RELEASE"

      - name: Check version consistency (APK vs git tag)
        run: |
          aapt=$(ls "$ANDROID_HOME"/build-tools/*/aapt | tail -1)
          version_in_apk=$("$aapt" dump badging "$APK_RELEASE" | grep -oP "versionName='\K[^']+")
          tag=${GITHUB_REF#refs/tags/}
          expected=${tag#v}
          echo "Version APK : $version_in_apk | Tag git : $tag (attendu : $expected)"
          if [ "$version_in_apk" != "$expected" ]; then
            echo "::error::Incohérence de version entre l'APK ($version_in_apk) et le tag ($tag)."
            exit 1
          fi

      - name: Generate and verify checksums
        working-directory: ${{ env.APK_OUTPUT_DIR }}
        run: |
          sha256sum *.apk > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Publish release (draft)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.APK_OUTPUT_DIR }}/*.apk
            ${{ env.APK_OUTPUT_DIR }}/SHA256SUMS.txt
          draft: true
          name: Sankamusic ${{ github.ref_name }}
          body: |
            ## Sankamusic ${{ github.ref_name }}

            Release générée par le CI. Vérifications passées :
            - Un seul APK universel signé
            - Signature valide (`apksigner verify`)
            - Version APK == tag git (${{ github.ref_name }})
            - SHA-256 vérifié

            > ⚠️ Release en **brouillon** : publier uniquement après la
            > vérification post-publication (RELEASE_GUIDE.md étape 7).
