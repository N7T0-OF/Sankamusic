# CI — Validation continue (sans publication)
#
# Conforme à RELEASE_GUIDE.md § 5 : le CI doit échouer plutôt que laisser passer
# un artefact incertain. Ce workflow valide chaque push/PR ; il ne publie rien.
#
# ⚠️ Ne devient effectif que lorsque le projet Gradle Android existe (Phase 2 du
# ROADMAP). Tant que `./gradlew` n'existe pas, ce workflow échouera — c'est voulu.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # À adapter si le module Android porte un autre nom que `app`
  GRADLE_TASK: assembleRelease
  APK_OUTPUT_DIR: app/build/outputs/apk/release

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve Android SDK version
        # Source unique de vérité : lit `androidSdk` depuis le version catalog, pour
        # que le passage à la Phase 2 (androidSdk → "36") ne change qu'un point.
        id: sdkver
        run: |
          # Ligne d'affectation androidSdk = "35" ; on prend la première valeur
          # entre guillemets (cut -d'"' -f2) — robuste même si un commentaire
          # en fin de ligne mentionne une autre valeur (ex. "36").
          V="$(grep -E '^androidSdk *=' gradle/libs.versions.toml | cut -d'"' -f2 | head -1)"
          echo "ANDROID_SDK_VERSION=$V" >> "$GITHUB_ENV"
          echo "Android SDK version (from catalog): $V"

      - name: Install Android SDK
        run: |
          # ubuntu-latest n'installe pas l'Android SDK par défaut → AGP ne trouve
          # pas compileSdk. On l'installe via cmdline-tools, puis on expose
          # ANDROID_HOME / ANDROID_SDK_ROOT aux steps suivants (via GITHUB_ENV).
          # ⚠️ On n'écrit PAS sdk.dir dans local.properties : sur certains postes,
          # AGP rejette la voie LOCAL_SDK_DIR de ce fichier (SdkLocator.validateSdkPath),
          # alors qu'ANDROID_HOME fonctionne (verrou levé en local par ce chemin).
          # NB : la version (android-35 aujourd'hui, android-36 à la Phase 2) vient
          # du version catalog (étape précédente) — source unique.
          SDK="${ANDROID_HOME:-$HOME/android-sdk}"
          PLAT="${ANDROID_SDK_VERSION:-35}"
          BT="${ANDROID_SDK_VERSION:-35}.0.0"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o /tmp/cmdline.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q /tmp/cmdline.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-$PLAT" "build-tools;$BT" >/dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          rm -f local.properties
          echo "Android SDK installé dans $SDK (platforms;android-$PLAT, build-tools;$BT)"

      - name: Run tests
        run: ./gradlew test

      - name: Test the Phase 2 validation gate itself
        # Couvre le garde-fou : une régression du garde-fou doit casser le CI.
        run: bash scripts/test-phase2-validation.sh

      - name: Test upstream report logic (offline)
        # Couvre la logique pure de check-upstream.sh (pattern_matches +
        # agrégation des plages) sans appeler l'API live.
        run: bash scripts/test-upstream.sh

      - name: Check toolchain audit script syntax
        # Vérifie que check-toolchain.sh (audit d'environnement Phase 2, exécuté
        # localement sur le poste équipé) reste syntactiquement valide.
        run: bash -n scripts/check-toolchain.sh

      - name: Phase 2 validation gate
        # Garde-fou : refuse une plage manifest à 2.x sans le marqueur
        # PHASE2_V2_VALIDATED (généré uniquement après le pipeline Phase 2).
        run: bash scripts/check-phase2-validation.sh
        env:
          PHASE2_V2_VALIDATED: ${{ secrets.PHASE2_V2_VALIDATED }}

      - name: Build release APK
        run: ./gradlew $GRADLE_TASK

      - name: Enforce exactly one release APK
        run: |
          mapfile -t apks < <(ls "$APK_OUTPUT_DIR"/*.apk 2>/dev/null || true)
          count=${#apks[@]}
          echo "APK(s) détecté(s) : $count"
          for f in "${apks[@]}"; do echo "  - $f"; done
          if [ "$count" -ne 1 ]; then
            echo "::error::Release invalide : $count APK(s). Il faut EXACTEMENT 1 APK universel signé."
            exit 1
          fi
          case "${apks[0]}" in
            *-debug*|*-unsigned*|*unaligned*)
              echo "::error::Artefact non valide pour publication : ${apks[0]}"
              exit 1
              ;;
          esac
