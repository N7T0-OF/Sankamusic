# ── Gradle ──────────────────────────────────────────────────────────────
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# ── AndroidX ────────────────────────────────────────────────────────────
android.useAndroidX=true
android.nonTransitiveRClass=true

# ── SOURCE UNIQUE DE VÉRITÉ DE LA VERSION ───────────────────────────────
# ⚠️ La version n'est définie QU'ICI. Elle est propagée vers :
#   - versionName de l'APK (app/build.gradle.kts)
#   - nom de l'artefact : Sankamusic-v<version>.apk
#   - BuildConfig (affichage « À propos »)
#   - tag git v<version> et titre de la release GitHub (procédure RELEASE_GUIDE.md)
# Le CI vérifie que versionName(APK) == tag git (release.yml) — toute incohérence échoue.
#
# Version de départ du nouveau projet — à adapter lors de la première release.
SANKAMUSIC_VERSION=0.2.0
SANKAMUSIC_VERSION_CODE=2
